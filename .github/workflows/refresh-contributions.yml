name: Refresh contribution dashboard

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh SVGs and profile summary
        run: python scripts/update_contributions.py
      - name: Commit refreshed dashboard
        run: |
          if git diff --quiet; then
            echo "Contribution dashboard is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/contribution-stats.svg assets/contribution-calendar.svg assets/contributions-30d.svg
          git commit -m "Refresh contribution dashboard"
          git push
